name = "ping-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of origins allowed to call the API (your Pages URL + local dev).
ALLOWED_ORIGINS = "http://localhost:5173"
# Set to your Firebase project id to require a signed-in user on every request.
FIREBASE_PROJECT_ID = ""

# Secrets (set with `npx wrangler secret put <NAME>`, or .dev.vars locally):
#   GOOGLE_MAPS_SERVER_KEY  – Places API (New) + Routes API
#   META_ACCESS_TOKEN       – optional, only if tokenless oEmbed gets rate-limited
